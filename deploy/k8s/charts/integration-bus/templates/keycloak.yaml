apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-bus-keycloak-realm
data:
  integration-bus-realm.json: |-
{{ .Files.Get "files/keycloak/integration-bus-realm.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-keycloak
  template:
    metadata:
      labels:
        app: integration-bus-keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword | quote }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/integration-bus/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /realms/integration-bus/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: realm
          configMap:
            name: integration-bus-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-keycloak
spec:
  type: NodePort
  selector:
    app: integration-bus-keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.keycloak.nodePort }}
