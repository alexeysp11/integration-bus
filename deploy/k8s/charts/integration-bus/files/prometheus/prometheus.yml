global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'processing-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['integration-bus-processing-api:5201']

  # The four worker services run as multiple replicas. The headless "-pods" Service of each workload resolves to one A
  # record per ready pod, so DNS service discovery scrapes every replica individually instead of a single ClusterIP.
  - job_name: 'saga-orchestrator'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-saga-orchestrator-service-pods']
        type: 'A'
        port: 6001
        refresh_interval: 10s

  - job_name: 'account-balance'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-account-balance-service-pods']
        type: 'A'
        port: 6002
        refresh_interval: 10s

  - job_name: 'compliance'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-compliance-service-pods']
        type: 'A'
        port: 6003
        refresh_interval: 10s

  - job_name: 'core-ledger'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-core-ledger-service-pods']
        type: 'A'
        port: 6004
        refresh_interval: 10s

  - job_name: 'identity'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['integration-bus-identity-service:6006']
