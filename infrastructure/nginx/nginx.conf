# Edge reverse proxy in front of Gateway.Api: TLS termination, header sanitization and per-client rate limiting.
# Design and tuning: docs/api-gateway/README.md (relative to the repository root).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    ignore_invalid_headers on;
    underscores_in_headers off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    log_format edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time limit=$limit_req_status';
    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    # Rate limits are tracked per client address. Binary keys keep every zone small (about 16000 clients per MB).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=ledger_write:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=accounts_write:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=per_client_connections:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    upstream gateway {
        server integration-bus-gateway-api:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # TLS is mandatory: plain HTTP is only served for the probe endpoint above
        location / {
            default_type application/json;
            return 426 '{"status":426,"error":"HTTPS is required."}';
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        limit_conn per_client_connections 50;

        # Never forward client-supplied proxy or identity headers: the edge is the only trusted source of them.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Authenticated-Subject "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Writes that start a saga or move money get the strictest budget
        location = /api/v1/ledger/transaction {
            limit_req zone=ledger_write burst=20 nodelay;
            proxy_pass http://gateway;
        }

        location ~ ^/api/v1/accounts/ {
            limit_req zone=accounts_write burst=20 nodelay;
            proxy_pass http://gateway;
        }

        location / {
            limit_req zone=api_general burst=100 nodelay;
            proxy_pass http://gateway;
        }

        # Operational endpoints of the proxied services are not part of the public API surface
        location ~ ^/(metrics|health)$ {
            return 404;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"status":429,"error":"Too many requests. Retry later."}\n';
        }
    }
}
