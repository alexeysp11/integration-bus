apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: integration-bus-db
spec:
  serviceName: integration-bus-db
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-db
  template:
    metadata:
      labels:
        app: integration-bus-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # wal_level=logical + replication slots/senders are required for Debezium's pgoutput CDC plugin
          args: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: integration-bus-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- .Values.postgresResources | toYaml | nindent 12 }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: init-script
          configMap:
            name: integration-bus-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-db
spec:
  selector:
    app: integration-bus-db
  ports:
    - port: 5432
      targetPort: 5432
