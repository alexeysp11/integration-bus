apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-jaeger
  template:
    metadata:
      labels:
        app: integration-bus-jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-jaeger
spec:
  selector:
    app: integration-bus-jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: {{ .Values.jaeger.uiNodePort }}
  type: NodePort
