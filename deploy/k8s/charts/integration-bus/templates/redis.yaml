apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: integration-bus-redis
spec:
  serviceName: integration-bus-redis
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-redis
  template:
    metadata:
      labels:
        app: integration-bus-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["redis-server"]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
          resources:
            {{- .Values.redisResources | toYaml | nindent 12 }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: integration-bus-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-redis
spec:
  selector:
    app: integration-bus-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-redis-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-redis-commander
  template:
    metadata:
      labels:
        app: integration-bus-redis-commander
    spec:
      containers:
        - name: redis-commander
          image: {{ .Values.redisCommander.image }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: integration-bus-secrets
                  key: redis-password
            - name: REDIS_HOSTS
              value: local:integration-bus-redis:6379:0:$(REDIS_PASSWORD)
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-redis-commander
spec:
  type: NodePort
  selector:
    app: integration-bus-redis-commander
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: {{ .Values.redisCommander.nodePort }}
