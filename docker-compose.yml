version: '3.8'

services:
  integration-bus-kafka:
    image: apache/kafka:latest
    container_name: integration-bus-kafka
    ports:
      - "9092:9092"
    environment:
      # JVM memory settings
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      
      # Roles (KRaft mode without Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@integration-bus-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
      # Setting up networks
      # 9092 - for external clients (localhost)
      # 9094 - for internal clients inside Docker (service name)
      KAFKA_LISTENERS: PLAINTEXT://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://integration-bus-kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-bus-network

  integration-bus-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: integration-bus-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      # Сonnect via the internal name and port
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: integration-bus-kafka:9094
    depends_on:
      - integration-bus-kafka
    networks:
      - integration-bus-network

  # Background container for automated Kafka topic initialization and provisioning
  integration-bus-kafka-provisioner:
    image: apache/kafka:latest
    container_name: integration-bus-kafka-provisioner
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        echo "Waiting for Kafka broker to reach a healthy operational state..."
        while ! /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server integration-bus-kafka:9094 >/dev/null 2>&1; do
          sleep 1
        done

        echo "Kafka broker is ready. Provisioning total infrastructure topic topologies..."
        
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic saga-transaction-start
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-hold
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-hold-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-hold-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic compliance-limits-check
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic compliance-limits-check-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic compliance-limits-check-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic core-ledger-record-write
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic core-ledger-record-write-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic core-ledger-record-write-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-confirm
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-confirm-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-confirm-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic accounting-balance-topup
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic accounting-balance-topup-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic accounting-balance-topup-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-database-seed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-database-seed-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-database-seed-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-release
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-release-passed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-release-failed
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server integration-bus-kafka:9094 --if-not-exists --partitions 2 --replication-factor 1 --topic account-balance-release-skipped

        echo "Infrastructure topic auto-provisioning pipeline completed successfully."
    depends_on:
      integration-bus-kafka:
        condition: service_healthy
    networks:
      - integration-bus-network

  integration-bus-redis:
    image: redis:alpine
    container_name: integration-bus-redis
    command: redis-server --requirepass secret_password_123 --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secret_password_123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - integration-bus-network
    restart: unless-stopped

  # Web-GUI management tool via official GitHub Container Registry
  integration-bus-redis-commander:
    container_name: integration-bus-redis-commander
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:integration-bus-redis:6379:0:secret_password_123
    ports:
      - "8082:8081"
    depends_on:
      integration-bus-redis:
        condition: service_healthy
    networks:
      - integration-bus-network

  # API Layer: Gateways
  integration-bus-gateway-api:
    build:
      context: .
      dockerfile: src/Api/IntegrationBus.Gateway.Api/Dockerfile
    container_name: integration-bus-gateway-api
    ports:
      - "5038:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - ReverseProxy__Clusters__processing-cluster__Destinations__http-destination__Address=http://integration-bus-processing-api:8080
      - ReverseProxy__Clusters__processing-cluster__Destinations__https-destination__Address=http://integration-bus-processing-api:8080
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  integration-bus-processing-api:
    build:
      context: .
      dockerfile: src/Api/IntegrationBus.Processing.Api/Dockerfile
    container_name: integration-bus-processing-api
    ports:
      - "5201:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  # Service Layer: Workers
  integration-bus-saga-orchestrator-service:
    build:
      context: .
      dockerfile: src/Services/IntegrationBus.SagaOrchestrator.Service/Dockerfile
    container_name: integration-bus-saga-orchestrator-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:6001
      - ConnectionStrings__SagaDb=Host=integration-bus-db;Port=5432;Database=saga_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    ports:
      - "6001:6001"
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  integration-bus-account-balance-service:
    build:
      context: .
      dockerfile: src/Services/IntegrationBus.AccountBalance.Service/Dockerfile
    container_name: integration-bus-account-balance-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:6002
      - ConnectionStrings__BalanceDb=Host=integration-bus-db;Port=5432;Database=accounting_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    ports:
      - "6002:6002"
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  integration-bus-compliance-service:
    build:
      context: .
      dockerfile: src/Services/IntegrationBus.Compliance.Service/Dockerfile
    container_name: integration-bus-compliance-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:6003
      - ConnectionStrings__ComplianceDb=Host=integration-bus-db;Port=5432;Database=compliance_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    ports:
      - "6003:6003"
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  integration-bus-core-ledger-service:
    build:
      context: .
      dockerfile: src/Services/IntegrationBus.CoreLedger.Service/Dockerfile
    container_name: integration-bus-core-ledger-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:6004
      - ConnectionStrings__LedgerDb=Host=integration-bus-db;Port=5432;Database=ledger_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=integration-bus-kafka:9094
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/server-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}
    ports:
      - "6004:6004"
    depends_on:
      integration-bus-db:
        condition: service_healthy
      integration-bus-kafka-provisioner:
        condition: service_completed_successfully
    networks:
      - integration-bus-network
    restart: unless-stopped

  integration-bus-db:
    image: postgres
    container_name: integration-bus-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "54321:5432"
    networks:
      - integration-bus-network

  integration-bus-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: integration-bus-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - integration-bus-network

  integration-bus-grafana:
    image: grafana/grafana:11.1.0
    container_name: integration-bus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - integration-bus-network

networks:
  integration-bus-network:
    driver: bridge
