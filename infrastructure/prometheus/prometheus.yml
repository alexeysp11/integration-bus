global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'processing-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['integration-bus-processing-api:5201']

  # The four worker services run as multiple replicas (see "deploy.replicas" in docker-compose.yml). Docker's
  # embedded DNS answers a service-name lookup with one A record per replica, so DNS service discovery scrapes
  # every replica individually instead of whichever single replica a static target happens to resolve to.
  - job_name: 'saga-orchestrator'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-saga-orchestrator-service']
        type: 'A'
        port: 6001
        refresh_interval: 10s

  - job_name: 'account-balance'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-account-balance-service']
        type: 'A'
        port: 6002
        refresh_interval: 10s

  - job_name: 'compliance'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-compliance-service']
        type: 'A'
        port: 6003
        refresh_interval: 10s

  - job_name: 'core-ledger'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['integration-bus-core-ledger-service']
        type: 'A'
        port: 6004
        refresh_interval: 10s

  - job_name: 'identity'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['integration-bus-identity-service:6006']
