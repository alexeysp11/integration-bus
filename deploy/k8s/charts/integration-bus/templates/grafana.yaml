apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-grafana
  template:
    metadata:
      labels:
        app: integration-bus-grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-grafana
spec:
  type: NodePort
  selector:
    app: integration-bus-grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: {{ .Values.grafana.nodePort }}
