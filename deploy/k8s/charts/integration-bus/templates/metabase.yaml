apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: integration-bus-metabase-plugins
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: integration-bus-metabase-driver-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: metabase-driver-setup
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -f /plugins/clickhouse.metabase-driver.jar ]; then
                curl -sSL -o /plugins/clickhouse.metabase-driver.jar {{ .Values.metabase.driverUrl }}
              fi
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: integration-bus-metabase-plugins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-metabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-metabase
  template:
    metadata:
      labels:
        app: integration-bus-metabase
    spec:
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z integration-bus-clickhouse 8123; do echo waiting for clickhouse; sleep 2; done"]
      containers:
        - name: metabase
          image: {{ .Values.metabase.image }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: integration-bus-metabase-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-metabase
spec:
  type: NodePort
  selector:
    app: integration-bus-metabase
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: {{ .Values.metabase.nodePort }}
