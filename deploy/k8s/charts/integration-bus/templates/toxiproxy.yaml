{{- if .Values.chaos.toxiproxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-bus-toxiproxy-config
data:
  toxiproxy.json: |-
{{ .Files.Get "files/toxiproxy/toxiproxy.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-toxiproxy
  template:
    metadata:
      labels:
        app: integration-bus-toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: {{ .Values.chaos.toxiproxy.image }}
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - containerPort: 8474
            - containerPort: 6380
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: integration-bus-toxiproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-toxiproxy
spec:
  type: NodePort
  selector:
    app: integration-bus-toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: 8474
      nodePort: {{ .Values.chaos.toxiproxy.nodePort }}
    - name: redis
      port: 6380
      targetPort: 6380
{{- end }}
