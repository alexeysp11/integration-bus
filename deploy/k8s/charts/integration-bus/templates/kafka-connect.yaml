apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-bus-kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-bus-kafka-connect
  template:
    metadata:
      labels:
        app: integration-bus-kafka-connect
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z integration-bus-db 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-kafka-topics
          image: busybox:1.36
          command: ["sh", "-c", "sleep 15"]
      containers:
        - name: kafka-connect
          image: {{ .Values.kafkaConnect.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: BOOTSTRAP_SERVERS
              value: integration-bus-kafka:9094
            - name: GROUP_ID
              value: integration-bus-kafka-connect
            - name: CONFIG_STORAGE_TOPIC
              value: connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: connect-status
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: integration-bus-kafka-connect
spec:
  type: NodePort
  selector:
    app: integration-bus-kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: {{ .Values.kafkaConnect.nodePort }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: integration-bus-debezium-registrar
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: debezium-registrar
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/scripts/register-connectors.sh"]
          volumeMounts:
            - name: source-connectors
              mountPath: /connectors/source
            - name: sink-connectors
              mountPath: /connectors/sink
            - name: script
              mountPath: /scripts
      volumes:
        - name: source-connectors
          configMap:
            name: integration-bus-debezium-connectors
        - name: sink-connectors
          configMap:
            name: integration-bus-clickhouse-sink-connectors
        - name: script
          configMap:
            name: integration-bus-debezium-registrar-script
            defaultMode: 0755
